name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify-gem.yml

  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: [verify, test]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # for RubyGems Trusted Publishing (OIDC); no API key is stored
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: '4.0.7'
          bundler-cache: true

      - name: Check the tag matches the gem version
        run: |
          version="$(ruby -r./lib/url_canonicalize/version -e 'print URLCanonicalize::VERSION')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match gem version v${version}" >&2
            exit 1
          fi

      - name: Build and publish to RubyGems
        uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
