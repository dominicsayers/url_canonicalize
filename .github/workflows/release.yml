name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify-gem.yml

  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: [verify, test]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # for RubyGems Trusted Publishing (OIDC); no API key is stored
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: '4.0.9'
          bundler-cache: true

      - name: Check the tag matches the gem version
        run: |
          version="$(ruby -r./lib/url_canonicalize/version -e 'print URLCanonicalize::VERSION')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match gem version v${version}" >&2
            exit 1
          fi

      - name: Build and publish to RubyGems
        uses: rubygems/release-gem@5c53f5308233b7c0f47411f0471b3faae6fa57b2 # v1.4.2
